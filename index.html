<!DOCTYPE html>
<html lang="pt-BR">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Sonhador</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone para rodar JSX direto no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Recharts/2.12.7/Recharts.min.js"></script>
  <style>
    body { font-family: 'IBM Plex Sans', sans-serif; background-color: #09090b; color: #e7e5e4; }
    .font-serif { font-family: 'Fraunces', serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const { 
      Coffee, Package, ShoppingCart, TrendingUp, Settings: SettingsIcon, 
      Plus, Trash2, AlertTriangle, CheckCircle2, Clock, LayoutDashboard, Wallet, ChevronDown 
    } = LucideReact;
    const { BarChart, Bar, XAxis, YAxis, ResponsiveContainer, Tooltip, CartesianGrid, Cell } = Recharts;

    const uid = () => Math.random().toString(36).slice(2, 10);
    const brl = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const pct = (n) => `${((Number(n) || 0) * 100).toFixed(1)}%`;
    const dateBR = (iso) => {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    };

    const CANAIS = ['Direto', 'Shopee', 'iFood', 'Mercado Livre'];
    const FORMAS_PAGTO = ['Pix', 'Dinheiro', 'Débito', 'Crédito'];
    const CAIXA_TIPOS = ['Despesa', 'Compra de café', 'Aporte', 'Retirada / Pró-labore'];
    const CAIXA_CATEGORIAS = {
      'Despesa': ['Embalagem', 'Etiqueta', 'Frete', 'Anúncios', 'Taxa de plataforma extra', 'Outro'],
      'Compra de café': ['Matéria-prima', 'Outro'],
      'Aporte': ['Capital próprio', 'Empréstimo', 'Outro'],
      'Retirada / Pró-labore': ['Retirada pessoal', 'Outro'],
    };

    const DEFAULT_PRODUTOS = [
      { id: uid(), nome: 'Tradicional 500g moído', custo: 20, preco: 30 },
      { id: uid(), nome: 'Gourmet 500g moído', custo: 30, preco: 45 },
      { id: uid(), nome: 'Especial 500g moído', custo: 40, preco: 60 },
      { id: uid(), nome: 'Especial 500g grãos', custo: 40, preco: 60 },
      { id: uid(), nome: 'Especial 250g moído', custo: 23, preco: 35 },
    ];

    const DEFAULT_LOTES = {
      'Tradicional 500g moído': 15,
      'Gourmet 500g moído': 12,
      'Especial 250g moído': 10,
      'Especial 500g moído': 2,
      'Especial 500g grãos': 2,
    };

    const DEFAULT_PEDIDOS_RAW = [
      ['2026-07-23', 'Karina Agua Rasa', 'Gourmet 500g moído', 2, 45, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-07-23', 'Karina Agua Rasa', 'Especial 250g moído', 3, 35, 'Dinheiro', 'Direto', 'Pendente', 'Não'],
      ['2026-07-29', 'Simone (Manicure)', 'Gourmet 500g moído', 1, 45, 'Pix', 'Direto', 'Pendente', 'Sim'],
      ['2026-07-29', 'Anacleto Zacaria', 'Tradicional 500g moído', 1, 30, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-07-29', 'Denis Corts', 'Tradicional 500g moído', 1, 30, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-07-29', 'Alex Mela', 'Gourmet 500g moído', 1, 45, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-07-29', 'Alex Mela', 'Especial 500g moído', 1, 60, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-02', 'Andreza (Isabel)', 'Gourmet 500g moído', 1, 45, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-07-29', 'Mada', 'Tradicional 500g moído', 1, 30, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-07-29', 'Lucas (Pai)', 'Tradicional 500g moído', 1, 30, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-07-29', 'Felipe (Jacira)', 'Especial 250g moído', 1, 35, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-02', 'Mayara FT2', 'Especial 250g moído', 1, 35, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-02', 'Gustavo FT2', 'Tradicional 500g moído', 1, 30, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-02', 'Maria FT2', 'Gourmet 500g moído', 1, 45, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-02', 'Maria FT2', 'Especial 250g moído', 1, 35, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-03', 'Wilson Km', 'Gourmet 500g moído', 1, 45, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-04', 'Maria Manicure', 'Tradicional 500g moído', 2, 30, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-04', 'Maria Manicure', 'Gourmet 500g moído', 1, 45, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-04', 'Stefany (Kayke)', 'Tradicional 500g moído', 1, 30, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-04', 'Ale (Teco)', 'Tradicional 500g moído', 1, 30, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-04', 'Nivaldo Km', 'Especial 250g moído', 1, 35, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-04', 'Gustave Km', 'Especial 500g grãos', 1, 60, 'Pix', 'Direto', 'Pendente', 'Não'],
      ['2026-08-05', 'Kaline', 'Gourmet 500g moído', 1, 45, 'Pix', 'Direto', 'Pendente', 'Não'],
    ].map(([data, cliente, produto, qtd, precoUnit, formaPagto, canal, status, recompra]) => ({
      id: uid(), data, cliente, produto, qtd, precoUnit, formaPagto, canal, status, recompra,
    }));

    const DEFAULT_CONFIG = {
      taxaShopee: 0.18,
      taxaIfood: 0.12,
      taxaML: 0.13,
      taxaCredito: 0.04,
      taxaDebito: 0.015,
      reorderThreshold: 0.55,
      planThreshold: 0.35,
      giroPct: 0.55,
      caixaPct: 0.30,
      prolaborePct: 0.15,
    };

    const DEFAULT_CAIXA = [
      { id: uid(), data: '2026-07-20', tipo: 'Aporte', categoria: 'Capital próprio', descricao: 'Investimento inicial pra produzir o lote', valor: 1000 },
      { id: uid(), data: '2026-07-20', tipo: 'Compra de café', categoria: 'Matéria-prima', descricao: 'Produção do lote (41 pacotes)', valor: 1000 },
    ];

    async function loadKey(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        if (item !== null) return JSON.parse(item);
        return fallback;
      } catch {
        return fallback;
      }
    }
    async function saveKey(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.error('storage error', key, e);
      }
    }

    function taxaDoPedido(pedido, config) {
      if (pedido.canal === 'Shopee') return config.taxaShopee;
      if (pedido.canal === 'iFood') return config.taxaIfood;
      if (pedido.canal === 'Mercado Livre') return config.taxaML;
      if (pedido.formaPagto === 'Crédito') return config.taxaCredito;
      if (pedido.formaPagto === 'Débito') return config.taxaDebito;
      return 0;
    }

    function computePedido(pedido, produtosMap, config) {
      const produto = produtosMap[pedido.produto] || { custo: 0, preco: 0 };
      const bruto = Number(pedido.qtd) * Number(pedido.precoUnit);
      const custoTotal = Number(pedido.qtd) * Number(produto.custo);
      const taxaPct = taxaDoPedido(pedido, config);
      const valorTaxa = bruto * taxaPct;
      const liquido = bruto - valorTaxa;
      const lucro = liquido - custoTotal;
      const margem = bruto > 0 ? lucro / bruto : 0;
      return { ...pedido, bruto, custoTotal, taxaPct, valorTaxa, liquido, lucro, margem };
    }

    function BagGauge({ pctComprometido, status }) {
      const fillPct = Math.max(0, Math.min(1, pctComprometido));
      const fill = (1 - Math.min(1, fillPct)) * 100;
      const colorMap = {
        'FALTA PRODUZIR': { fill: '#e35d4f', glow: 'rgba(227,93,79,0.4)' },
        'REPOR AGORA': { fill: '#e35d4f', glow: 'rgba(227,93,79,0.35)' },
        'Planejar reposição': { fill: '#d6a24a', glow: 'rgba(214,162,74,0.3)' },
        'OK': { fill: '#5fae7a', glow: 'rgba(95,174,122,0.3)' },
      };
      const c = colorMap[status] || colorMap.OK;
      return (
        <div className="relative w-16 h-20 mx-auto">
          <div
            className="absolute inset-0 bg-stone-950/60 border border-stone-700/60"
            style={{ clipPath: 'polygon(18% 0%, 82% 0%, 100% 18%, 100% 100%, 0% 100%, 0% 18%)' }}
          >
            <div
              className="absolute bottom-0 left-0 right-0 transition-all duration-700"
              style={{ height: `${fill}%`, background: `linear-gradient(180deg, ${c.fill}dd, ${c.fill})`, boxShadow: `0 0 16px ${c.glow} inset` }}
            />
          </div>
          <div className="absolute inset-0 flex items-center justify-center">
            <span className="text-[11px] font-semibold text-stone-50 mix-blend-difference">{Math.round(fillPct * 100)}%</span>
          </div>
        </div>
      );
    }

    function NavButton({ active, onClick, icon: Icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center gap-2 px-3.5 py-2 rounded-full text-sm font-medium transition-colors whitespace-nowrap ${
            active ? 'bg-amber-500 text-stone-950' : 'text-stone-400 hover:text-stone-100 hover:bg-stone-800/70'
          }`}
        >
          <Icon size={15} strokeWidth={2.2} />
          {label}
        </button>
      );
    }

    function StatCard({ label, value, sub, tone = 'default' }) {
      const toneClass = tone === 'good' ? 'text-emerald-400' : tone === 'bad' ? 'text-rose-400' : 'text-stone-50';
      return (
        <div className="bg-stone-900/70 border border-stone-800 rounded-xl p-4">
          <div className="text-[11px] uppercase tracking-wider text-stone-500 font-medium">{label}</div>
          <div className={`text-2xl mt-1 font-serif ${toneClass}`}>{value}</div>
          {sub && <div className="text-xs text-stone-500 mt-1">{sub}</div>}
        </div>
      );
    }

    function App() {
      const [loaded, setLoaded] = useState(false);
      const [tab, setTab] = useState('dashboard');
      const [produtos, setProdutos] = useState([]);
      const [pedidos, setPedidos] = useState([]);
      const [lotes, setLotes] = useState({});
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [caixa, setCaixa] = useState([]);
      const [savingNote, setSavingNote] = useState('');

      useEffect(() => {
        (async () => {
          const [p, o, l, c, cx] = await Promise.all([
            loadKey('cafe_produtos', null),
            loadKey('cafe_pedidos', null),
            loadKey('cafe_lotes', null),
            loadKey('cafe_config', null),
            loadKey('cafe_caixa', null),
          ]);
          setProdutos(p || DEFAULT_PRODUTOS);
          setPedidos(o || DEFAULT_PEDIDOS_RAW);
          setLotes(l || DEFAULT_LOTES);
          setConfig(c || DEFAULT_CONFIG);
          setCaixa(cx || DEFAULT_CAIXA);
          setLoaded(true);
        })();
      }, []);

      const flash = (msg) => { setSavingNote(msg); setTimeout(() => setSavingNote(''), 1400); };

      const persist = useCallback((key, val, label) => {
        saveKey(key, val);
        flash(label);
      }, []);

      const produtosMap = useMemo(() => {
        const m = {};
        produtos.forEach(p => { m[p.nome] = p; });
        return m;
      }, [produtos]);

      const pedidosCalc = useMemo(() => pedidos.map(p => computePedido(p, produtosMap, config)), [pedidos, produtosMap, config]);
      const pedidosPagos = useMemo(() => pedidosCalc.filter(p => p.status === 'Pago'), [pedidosCalc]);

      const estoque = useMemo(() => {
        return produtos.map(prod => {
          const totalComprado = Number(lotes[prod.nome]) || 0;
          const vendidoConfirmado = pedidosPagos.filter(p => p.produto === prod.nome).reduce((s, p) => s + Number(p.qtd), 0);
          const reservadoPendente = pedidosCalc.filter(p => p.produto === prod.nome && p.status === 'Pendente').reduce((s, p) => s + Number(p.qtd), 0);
          const comprometido = vendidoConfirmado + reservadoPendente;
          const emEstoque = totalComprado - vendidoConfirmado;
          const disponivelLivre = totalComprado - comprometido;
          const pctComprometido = totalComprado > 0 ? comprometido / totalComprado : 0;
          let status = 'OK';
          if (totalComprado === 0) status = 'Sem lote cadastrado';
          else if (disponivelLivre < 0) status = 'FALTA PRODUZIR';
          else if (pctComprometido >= config.reorderThreshold) status = 'REPOR AGORA';
          else if (pctComprometido >= config.planThreshold) status = 'Planejar reposição';
          return { produto: prod.nome, totalComprado, vendidoConfirmado, reservadoPendente, comprometido, emEstoque, disponivelLivre, pctComprometido, status };
        });
      }, [produtos, lotes, pedidosPagos, pedidosCalc, config]);

      const kpis = useMemo(() => {
        const totalPedidos = pedidos.length;
        const bruto = pedidosPagos.reduce((s, p) => s + p.bruto, 0);
        const taxas = pedidosPagos.reduce((s, p) => s + p.valorTaxa, 0);
        const liquido = bruto - taxas;
        const custo = pedidosPagos.reduce((s, p) => s + p.custoTotal, 0);
        const lucro = liquido - custo;
        const margem = bruto > 0 ? lucro / bruto : 0;
        const ticket = pedidosPagos.length > 0 ? bruto / pedidosPagos.length : 0;
        const recompras = pedidos.filter(p => p.recompra === 'Sim').length;
        const pendentes = pedidos.filter(p => p.status !== 'Pago').length;
        const pedidosPendentesCalc = pedidosCalc.filter(p => p.status === 'Pendente');
        const potencialBruto = pedidosPendentesCalc.reduce((s, p) => s + p.bruto, 0);
        const potencialLucro = pedidosPendentesCalc.reduce((s, p) => s + p.lucro, 0);
        return { totalPedidos, bruto, taxas, liquido, custo, lucro, margem, ticket, recompras, pendentes, potencialBruto, potencialLucro };
      }, [pedidos, pedidosPagos, pedidosCalc]);

      const canalData = useMemo(() => {
        const m = {};
        CANAIS.forEach(c => { m[c] = { canal: c, receita: 0, taxa: 0, pedidos: 0 }; });
        pedidosCalc.forEach(p => {
          if (!m[p.canal]) m[p.canal] = { canal: p.canal, receita: 0, taxa: 0, pedidos: 0 };
          m[p.canal].receita += p.bruto;
          m[p.canal].taxa += p.valorTaxa;
          m[p.canal].pedidos += 1;
        });
        return Object.values(m).filter(d => d.pedidos > 0 || CANAIS.includes(d.canal));
      }, [pedidosCalc]);

      const produtoData = useMemo(() => {
        const m = {};
        pedidosCalc.forEach(p => {
          m[p.produto] = (m[p.produto] || 0) + Number(p.qtd);
        });
        return Object.entries(m).map(([nome, qtd]) => ({ nome: nome.replace(' moído', '').replace('500g', '5·'), qtd })).sort((a, b) => b.qtd - a.qtd);
      }, [pedidosCalc]);

      const recomprarLista = useMemo(() => estoque.filter(e => e.status === 'REPOR AGORA' || e.status === 'FALTA PRODUZIR').sort((a, b) => b.pctComprometido - a.pctComprometido), [estoque]);

      const emptyPedido = { data: new Date().toISOString().slice(0, 10), cliente: '', produto: produtos[0]?.nome || '', qtd: 1, precoUnit: produtos[0]?.preco || 0, formaPagto: 'Pix', canal: 'Direto', status: 'Pago', recompra: 'Não' };
      const [novoPedido, setNovoPedido] = useState(emptyPedido);
      useEffect(() => { if (produtos.length && !novoPedido.produto) setNovoPedido(v => ({ ...v, produto: produtos[0].nome, precoUnit: produtos[0].preco })); }, [produtos]);

      const addPedido = () => {
        if (!novoPedido.cliente.trim() || !novoPedido.produto) return;
        const p = { ...novoPedido, id: uid() };
        const next = [p, ...pedidos];
        setPedidos(next);
        persist('cafe_pedidos', next, 'Venda registrada');
        setNovoPedido({ ...emptyPedido, produto: novoPedido.produto, precoUnit: novoPedido.precoUnit, canal: novoPedido.canal, formaPagto: novoPedido.formaPagto });
      };
      const removePedido = (id) => {
        const next = pedidos.filter(p => p.id !== id);
        setPedidos(next);
        persist('cafe_pedidos', next, 'Venda removida');
      };
      const toggleStatus = (id) => {
        const next = pedidos.map(p => p.id === id ? { ...p, status: p.status === 'Pago' ? 'Pendente' : 'Pago' } : p);
        setPedidos(next);
        persist('cafe_pedidos', next, 'Status atualizado');
      };

      const [novoProduto, setNovoProduto] = useState({ nome: '', custo: '', preco: '' });
      const addProduto = () => {
        if (!novoProduto.nome.trim()) return;
        const p = { id: uid(), nome: novoProduto.nome.trim(), custo: Number(novoProduto.custo) || 0, preco: Number(novoProduto.preco) || 0 };
        const next = [...produtos, p];
        setProdutos(next);
        persist('cafe_produtos', next, 'Produto adicionado');
        setNovoProduto({ nome: '', custo: '', preco: '' });
      };
      const updateProduto = (id, field, val) => {
        const next = produtos.map(p => p.id === id ? { ...p, [field]: field === 'nome' ? val : Number(val) } : p);
        setProdutos(next);
      };
      const commitProdutos = () => persist('cafe_produtos', produtos, 'Produtos salvos');
      const removeProduto = (id, nome) => {
        const emUso = pedidos.some(p => p.produto === nome);
        if (emUso) { alert('Esse café tem vendas registradas — remova as vendas antes, ou apenas deixe de usá-lo.'); return; }
        const next = produtos.filter(p => p.id !== id);
        setProdutos(next);
        persist('cafe_produtos', next, 'Produto removido');
      };

      const updateLote = (nome, val) => setLotes(v => ({ ...v, [nome]: Number(val) || 0 }));
      const commitLotes = () => persist('cafe_lotes', lotes, 'Estoque salvo');
      const [compraQtd, setCompraQtd] = useState({});
      const registrarCompra = (nome) => {
        const add = Number(compraQtd[nome]) || 0;
        if (add <= 0) return;
        const next = { ...lotes, [nome]: (Number(lotes[nome]) || 0) + add };
        setLotes(next);
        persist('cafe_lotes', next, 'Novo lote registrado');
        setCompraQtd(v => ({ ...v, [nome]: '' }));
      };

      const emptyCaixaEntry = { data: new Date().toISOString().slice(0, 10), tipo: 'Despesa', categoria: CAIXA_CATEGORIAS['Despesa'][0], descricao: '', valor: '' };
      const [novoCaixa, setNovoCaixa] = useState(emptyCaixaEntry);
      const addCaixa = () => {
        const valor = Number(novoCaixa.valor);
        if (!valor || valor <= 0) return;
        const c = { ...novoCaixa, valor, id: uid() };
        const next = [c, ...caixa];
        setCaixa(next);
        persist('cafe_caixa', next, 'Lançamento salvo');
        setNovoCaixa({ ...emptyCaixaEntry, tipo: novoCaixa.tipo, categoria: novoCaixa.categoria });
      };
      const removeCaixa = (id) => {
        const next = caixa.filter(c => c.id !== id);
        setCaixa(next);
        persist('cafe_caixa', next, 'Lançamento removido');
      };

      const [cfgDraft, setCfgDraft] = useState(config);
      useEffect(() => setCfgDraft(config), [config]);
      const commitConfig = () => {
        setConfig(cfgDraft);
        persist('cafe_config', cfgDraft, 'Configurações salvas');
      };

      const financeiro = useMemo(() => {
        const lucro = kpis.lucro;
        return {
          giro: lucro * config.giroPct,
          caixa: lucro * config.caixaPct,
          prolabore: lucro * config.prolaborePct,
        };
      }, [kpis, config]);

      const caixaCalc = useMemo(() => {
        const despesas = caixa.filter(c => c.tipo === 'Despesa').reduce((s, c) => s + Number(c.valor), 0);
        const compras = caixa.filter(c => c.tipo === 'Compra de café').reduce((s, c) => s + Number(c.valor), 0);
        const aportes = caixa.filter(c => c.tipo === 'Aporte').reduce((s, c) => s + Number(c.valor), 0);
        const retiradas = caixa.filter(c => c.tipo === 'Retirada / Pró-labore').reduce((s, c) => s + Number(c.valor), 0);
        const entradasVendas = kpis.liquido;
        const saldo = entradasVendas + aportes - despesas - compras - retiradas;
        return { despesas, compras, aportes, retiradas, entradasVendas, saldo };
      }, [caixa, kpis]);

      if (!loaded) {
        return (
          <div className="min-h-screen bg-stone-950 flex items-center justify-center">
            <div className="flex items-center gap-2 text-stone-500 text-sm"><Coffee size={16} className="animate-pulse" /> Carregando seu painel...</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-stone-950 text-stone-200">
          <header className="sticky top-0 z-20 bg-stone-950/95 backdrop-blur border-b border-stone-800/80">

                      <thead>
                        <tr className="text-stone-500 text-left border-b border-stone-800 [&>th]:px-3 [&>th]:py-2.5 [&>th]:font-medium whitespace-nowrap">
                          <th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th>
                        </tr>
                      </thead>
                      <tbody>
                        {[...caixa].sort((a, b) => b.data.localeCompare(a.data)).map(c => (
                          <tr key={c.id} className="border-b border-stone-800/60 [&>td]:px-3 [&>td]:py-2 whitespace-nowrap hover:bg-stone-800/30">
                            <td className="text-stone-400">{dateBR(c.data)}</td>
                            <td>
                              <span className={`text-[11px] rounded-full px-2 py-0.5 ${c.tipo === 'Aporte' ? 'bg-emerald-950/50 text-emerald-300 border border-emerald-900' : 'bg-stone-800 text-stone-300'}`}>{c.tipo}</span>
                            </td>
                            <td className="text-stone-400">{c.categoria}</td>
                            <td className="text-stone-400">{c.descricao || '—'}</td>
                            <td className={c.tipo === 'Aporte' ? 'text-emerald-400' : 'text-rose-400'}>
                              {c.tipo === 'Aporte' ? '+' : '-'}{brl(c.valor)}
                            </td>
                            <td><button onClick={() => removeCaixa(c.id)} className="text-stone-600 hover:text-rose-400"><Trash2 size={14} /></button></td>
                          </tr>
                        ))}
                        {caixa.length === 0 && (
                          <tr><td colSpan={6} className="px-3 py-6 text-center text-stone-600">Nenhum lançamento ainda.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {tab === 'config' && (
              <div className="space-y-5">
                <div className="bg-stone-900/70 border border-stone-800 rounded-xl p-5">
                  <div className="text-sm font-medium text-stone-300 mb-1">Taxas por canal de venda</div>
                  <p className="text-xs text-stone-500 mb-4">Aplicadas sobre o valor bruto de cada venda naquele canal.</p>
                  <div className="grid sm:grid-cols-3 gap-4">
                    {[
                      ['Shopee', 'taxaShopee'], ['iFood', 'taxaIfood'], ['Mercado Livre', 'taxaML'],
                    ].map(([label, key]) => (
                      <label key={key} className="block">
                        <span className="text-xs text-stone-500">{label}</span>
                        <div className="flex items-center mt-1 bg-stone-950 border border-stone-700 rounded-lg px-2.5 py-2">
                          <input type="number" step="0.1" value={(cfgDraft[key] * 100).toFixed(1)}
                            onChange={e => setCfgDraft(v => ({ ...v, [key]: Number(e.target.value) / 100 }))}
                            className="bg-transparent w-full outline-none text-sm" />
                          <span className="text-stone-500 text-sm">%</span>
                        </div>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="bg-stone-900/70 border border-stone-800 rounded-xl p-5">
                  <div className="text-sm font-medium text-stone-300 mb-1">Taxas de pagamento (vendas diretas)</div>
                  <p className="text-xs text-stone-500 mb-4">Só se aplicam quando o canal é "Direto" — Pix e Dinheiro não têm taxa.</p>
                  <div className="grid sm:grid-cols-2 gap-4">
                    {[['Cartão de crédito', 'taxaCredito'], ['Cartão de débito', 'taxaDebito']].map(([label, key]) => (
                      <label key={key} className="block">
                        <span className="text-xs text-stone-500">{label}</span>
                        <div className="flex items-center mt-1 bg-stone-950 border border-stone-700 rounded-lg px-2.5 py-2">
                          <input type="number" step="0.1" value={(cfgDraft[key] * 100).toFixed(1)}
                            onChange={e => setCfgDraft(v => ({ ...v, [key]: Number(e.target.value) / 100 }))}
                            className="bg-transparent w-full outline-none text-sm" />
                          <span className="text-stone-500 text-sm">%</span>
                        </div>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="bg-stone-900/70 border border-stone-800 rounded-xl p-5">
                  <div className="text-sm font-medium text-stone-300 mb-1">Regra de recompra</div>
                  <p className="text-xs text-stone-500 mb-4">% do lote vendido para acionar cada alerta.</p>
                  <div className="grid sm:grid-cols-2 gap-4">
                    <label className="block">
                      <span className="text-xs text-stone-500">Planejar reposição a partir de</span>
                      <div className="flex items-center mt-1 bg-stone-950 border border-stone-700 rounded-lg px-2.5 py-2">
                        <input type="number" step="1" value={(cfgDraft.planThreshold * 100).toFixed(0)}
                          onChange={e => setCfgDraft(v => ({ ...v, planThreshold: Number(e.target.value) / 100 }))}
                          className="bg-transparent w-full outline-none text-sm" />
                        <span className="text-stone-500 text-sm">%</span>
                      </div>
                    </label>
                    <label className="block">
                      <span className="text-xs text-stone-500">"Repor agora" a partir de</span>
                      <div className="flex items-center mt-1 bg-stone-950 border border-stone-700 rounded-lg px-2.5 py-2">
                        <input type="number" step="1" value={(cfgDraft.reorderThreshold * 100).toFixed(0)}
                          onChange={e => setCfgDraft(v => ({ ...v, reorderThreshold: Number(e.target.value) / 100 }))}
                          className="bg-transparent w-full outline-none text-sm" />
                        <span className="text-stone-500 text-sm">%</span>
                      </div>
                    </label>
                  </div>
                </div>

                <div className="bg-stone-900/70 border border-stone-800 rounded-xl p-5">
                  <div className="text-sm font-medium text-stone-300 mb-1">Divisão do lucro</div>
                  <p className="text-xs text-stone-500 mb-4">Idealmente soma 100%.</p>
                  <div className="grid sm:grid-cols-3 gap-4">
                    {[['Capital de giro', 'giroPct'], ['Caixa da empresa', 'caixaPct'], ['Pró-labore', 'prolaborePct']].map(([label, key]) => (
                      <label key={key} className="block">
                        <span className="text-xs text-stone-500">{label}</span>
                        <div className="flex items-center mt-1 bg-stone-950 border border-stone-700 rounded-lg px-2.5 py-2">
                          <input type="number" step="1" value={(cfgDraft[key] * 100).toFixed(0)}
                            onChange={e => setCfgDraft(v => ({ ...v, [key]: Number(e.target.value) / 100 }))}
                            className="bg-transparent w-full outline-none text-sm" />
                          <span className="text-stone-500 text-sm">%</span>
                        </div>
                      </label>
                    ))}
                  </div>
                  <div className="text-xs mt-2 text-stone-500">
                    Soma atual: {pct(cfgDraft.giroPct + cfgDraft.caixaPct + cfgDraft.prolaborePct)}
                  </div>
                </div>

                <button onClick={commitConfig} className="bg-amber-500 hover:bg-amber-400 text-stone-950 rounded-lg px-4 py-2.5 text-sm font-semibold">
                  Salvar configurações
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
